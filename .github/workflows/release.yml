name: Build & Release ShiftOx APK

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: '📝 本次版本更新說明 (若空白則優先讀取專案 RELEASE_NOTES.md)'
        required: false
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Gemini API Key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "// 🔑 由 GitHub Actions 自動注入的金鑰配置" > lib/services/api_keys.dart
          echo "const String geminiApiKey = '${GEMINI_API_KEY}';" >> lib/services/api_keys.dart

      - name: Restore Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "恢復專屬數位金鑰..."
            mkdir -p ~/.android
            echo "$KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
          else
            echo "未提供自訂金鑰，將使用預設金鑰編譯。"
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Rename APK with App Name and Version
        id: rename_apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | head -n 1 | awk '{print $2}' | cut -d'+' -f1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          APK_NAME="ShiftOx-v${VERSION}.apk"
          echo "APK_NAME=$APK_NAME" >> $GITHUB_ENV
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/${APK_NAME}"
          echo "Renamed APK to ${APK_NAME}"

      - name: Prepare Release Notes
        env:
          INPUT_RELEASE_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          if [ -n "$INPUT_RELEASE_NOTES" ]; then
            echo "$INPUT_RELEASE_NOTES" > RELEASE_BODY.md
          elif [ -f RELEASE_NOTES.md ]; then
            cat RELEASE_NOTES.md > RELEASE_BODY.md
          else
            echo "### 🚀 ShiftOx v${VERSION} 發布" > RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "最新版牛馬日誌已編譯完成，歡迎下載更新！" >> RELEASE_BODY.md
          fi

      - name: Upload Artifact (Summary Page Download)
        uses: actions/upload-artifact@v4
        with:
          name: ShiftOx-APK
          path: build/app/outputs/flutter-apk/${{ env.APK_NAME }}

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/${{ env.APK_NAME }}
          name: ShiftOx v${{ env.VERSION }}
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', env.VERSION) }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
